name: Apex Executive Intelligence Swarm

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # 08:30 IST daily

permissions:
  contents: read

concurrency:
  group: apex-executive-swarm
  cancel-in-progress: false

jobs:
  research-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check psycopg2-binary
      - name: Run specialist agent swarm
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SWARM_MAX_CANDIDATES: "5"
        run: python -m app.agent_swarm
