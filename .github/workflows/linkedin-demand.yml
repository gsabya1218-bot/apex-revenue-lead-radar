name: Apex LinkedIn Demand Signals (Manual Legacy)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover-public-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Explain manual legacy runner
        run: |
          echo "This legacy Tavily runner is manual-only because TAVILY_API_KEY is not configured."
          echo "Use Apex LinkedIn Buyer Signal Radar for scheduled 7-day discovery."
