name: Apex LinkedIn Buyer Signal Radar

on:
  workflow_dispatch:
  schedule:
    # Daily at 08:00 IST. The job is date-gated to the Dec 1–5 closure window.
    - cron: "30 2 * * *"

permissions:
  contents: read

concurrency:
  group: apex-linkedin-signal-radar
  cancel-in-progress: false

jobs:
  discover-linkedin-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check campaign window
        id: window
        shell: bash
        run: |
          TODAY=$(date -u +%Y%m%d)
          if [[ "${TODAY}" -ge "20261201" && "${TODAY}" -le "20261205" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Outside Dec 1–5 campaign window; scheduled collection skipped."
          fi
      - name: Install database driver
        if: steps.window.outputs.active == 'true'
        run: python -m pip install --disable-pip-version-check psycopg2-binary
      - name: Discover public LinkedIn signals
        if: steps.window.outputs.active == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          LINKEDIN_WINDOW_DAYS: "7"
          CAMPAIGN_START: "2026-12-01"
          CAMPAIGN_END: "2026-12-05"
        run: python -m app.linkedin_signals
      - name: Upload candidate export
        if: always() && steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apex-linkedin-candidates-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
