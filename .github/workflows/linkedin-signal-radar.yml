name: Apex LinkedIn Buyer Signal Radar

on:
  workflow_dispatch:
  schedule:
    # Daily at 08:00 IST. Research Nov 25–30; closure preparation Dec 1–5.
    - cron: "30 2 * * *"

permissions:
  contents: read

concurrency:
  group: apex-linkedin-signal-radar
  cancel-in-progress: false

jobs:
  discover-linkedin-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check discovery window
        id: window
        shell: bash
        run: |
          TODAY=$(date -u +%Y%m%d)
          if [[ "${TODAY}" -ge "20261125" && "${TODAY}" -le "20261205" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            if [[ "${TODAY}" -ge "20261201" ]]; then
              echo "phase=closure" >> "$GITHUB_OUTPUT"
            else
              echo "phase=research" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Outside Nov 25–Dec 5 research and closure window; skipped."
          fi
      - name: Install database driver
        if: steps.window.outputs.active == 'true'
        run: python -m pip install --disable-pip-version-check psycopg2-binary
      - name: Discover public LinkedIn signals
        if: steps.window.outputs.active == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LINKEDIN_WINDOW_DAYS: "7"
          CAMPAIGN_START: "2026-12-01"
          CAMPAIGN_END: "2026-12-05"
          DISCOVERY_PHASE: ${{ steps.window.outputs.phase }}
        run: python -m app.linkedin_signals
      - name: Upload candidate export
        if: always() && steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apex-linkedin-candidates-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
