name: Apex Revenue Lead Discovery

on:
  schedule:
    # 08:00 India Standard Time (02:30 UTC), every day
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-revenue-discovery
  cancel-in-progress: false

jobs:
  collect-commercial-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install database driver
        run: python -m pip install --disable-pip-version-check psycopg2-binary

      - name: Collect and store recent public signals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.discovery
